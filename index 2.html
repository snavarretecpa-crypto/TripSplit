<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#1c2430;--muted:#6b7480;--line:#e4e8ec;--accent:#18946f;--accent2:#e8f6f1;--owe:#d2463f;--owe2:#fdeceb;--r:14px}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 110px}
header{position:sticky;top:0;background:var(--accent);color:#fff;z-index:5}
header .in{max-width:560px;margin:0 auto;padding:14px 14px 0}
.ttl{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ttl h1{font-size:20px;margin:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:11px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.2);white-space:nowrap}
nav{display:flex;margin-top:10px}
nav button{flex:1;background:none;border:0;color:rgba(255,255,255,.75);font:600 14px inherit;padding:10px 0 12px;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:#fff;border-bottom-color:#fff}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-top:14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;font-weight:700}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .l{min-width:0;flex:1}
.row .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--accent);font-weight:700}.neg{color:var(--owe);font-weight:700}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;flex:none;font-size:14px}
.ico{width:38px;height:38px;border-radius:10px;background:var(--accent2);display:flex;align-items:center;justify-content:center;font-size:19px;flex:none}
.tx{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bg);margin-top:8px}
.tx .arrow{color:var(--muted)}
.btn{border:0;border-radius:10px;padding:10px 14px;font:600 14px inherit;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent2);color:var(--accent)}
.btn.danger{background:var(--owe2);color:var(--owe)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:15px 26px;border-radius:99px;font-size:16px;box-shadow:0 6px 20px rgba(24,148,111,.4);z-index:6}
.date{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin:18px 4px 4px}
.exp{cursor:pointer}
.grid3{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;font-size:14px;align-items:center}
.grid3 .h{font-size:11px;color:var(--muted);text-transform:uppercase;font-weight:700}
.r{text-align:right}
label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 5px;text-transform:uppercase}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-top:12px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font:600 13px inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mrow{display:grid;grid-template-columns:auto 1fr 84px 92px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mrow input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.mrow input[type=number]{padding:8px;font-size:15px;text-align:right}
.mrow .calc{text-align:right;font-size:13px;color:var(--muted)}
.note{font-size:13px;padding:9px 11px;border-radius:10px;margin-top:10px}
.note.ok{background:var(--accent2);color:var(--accent)}.note.bad{background:var(--owe2);color:var(--owe)}
.modal{position:fixed;inset:0;background:rgba(15,20,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
.sheet h3{margin:0;font-size:18px}
.sheet .top{display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:0;font-size:24px;color:var(--muted);cursor:pointer;padding:0 4px}
.actions{display:flex;gap:10px;margin-top:18px}.actions .btn{flex:1;padding:13px}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent)}
textarea{width:100%;min-height:180px;font:13px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:10px}
</style>

<style>
header{padding-top:env(safe-area-inset-top)}
.fab{bottom:calc(22px + env(safe-area-inset-bottom))}
.hbtn{background:rgba(255,255,255,.18);border:0;color:#fff;font:600 12px inherit;padding:5px 10px;border-radius:99px;cursor:pointer;margin-right:8px}
.banner{background:#fff4e0;color:#8a5a00;font-size:13px;padding:9px 12px;border-radius:10px;margin-top:14px}
.hero{text-align:center;padding:40px 10px 10px}

.hero h1{font-size:26px;margin:14px 0 6px}
.link{word-break:break-all;font:13px ui-monospace,Menlo,monospace;background:var(--bg);padding:10px;border-radius:10px;margin-top:8px}
/* senior-friendly sizing */
body{font-size:17px}
input,select{font-size:18px;padding:13px 14px}
.btn{padding:13px 18px;font-size:16px;min-height:50px}

nav button{font-size:15px;padding:12px 0 13px}
.sheet label,.card label{font-size:15px;color:var(--ink);text-transform:none;font-weight:700;margin:20px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:600 16px inherit;color:var(--ink);cursor:pointer;min-height:50px}
.chip.on{border-color:var(--accent);background:var(--accent2);color:var(--accent)}
.amt{font-size:36px;font-weight:800;text-align:center;padding:14px}
.sumbox{background:var(--bg);border-radius:12px;padding:6px 14px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:16px}
.linkbtn{background:none;border:0;color:var(--accent);font:700 16px inherit;padding:10px 0;cursor:pointer}
.you{text-align:center}.you .big{font-size:38px;margin:4px 0 8px}
.sheet .actions.sticky{position:sticky;bottom:-24px;background:#fff;padding:12px 0 8px;margin-top:22px;border-top:1px solid var(--line)}
.small{font-size:14px}.x{font-size:32px}
.fab{font-size:18px;padding:17px 32px}
.toast{font-size:17px;padding:14px 20px;top:auto;bottom:100px}
.mrow{grid-template-columns:auto 1fr 84px 100px}
.mrow input[type=checkbox]{width:24px;height:24px}
.grid3{font-size:15px}
</style>

<body>
<header><div class="in">
  <div class="ttl"><div style="display:flex;align-items:center;min-width:0"><button class="hbtn" id="tripsBtn" data-act="home" style="display:none">‹ Trips</button><h1 id="tripName">TripSplit</h1></div><span class="pill" id="status"></span></div>
  <nav id="tabs">
    <button data-tab="balances" class="on">💰 Who owes</button>
    <button data-tab="expenses">🧾 Expenses</button>
    <button data-tab="setup">⚙️ Setup</button>
  </nav>
</div></header>
<div class="wrap" id="view"></div>
<button class="btn fab" id="fab" data-act="add" style="display:none">+ Add expense</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid=n=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789';let s='';const b=new Uint8Array(n);(window.crypto||{}).getRandomValues?crypto.getRandomValues(b):b.forEach((_,i)=>b[i]=Math.random()*256);b.forEach(x=>s+=a[x%a.length]);return s};
const newId=()=>Date.now().toString(36)+rid(6);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const clone=o=>JSON.parse(JSON.stringify(o));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const COLORS=['#18946f','#3b6fd8','#d9822b','#8b5cf6','#d2463f','#0e8fa6','#b8860b','#c2185b','#5c6b7a','#2e7d32'];
const CATS={Food:'🍽️',Flights:'✈️',Lodging:'🏨',Transport:'🚆',Activities:'🎟️',Shopping:'🛍️',Groceries:'🛒','Visa & docs':'🛂',Others:'🧾'};
const CURS=['PHP','JPY','KRW','USD','SGD','HKD','THB','TWD','VND','MYR','IDR','CNY','EUR','GBP','AUD'];
const ZERO=['JPY','KRW','VND','IDR'];
const METHODS=['Cash','Credit card','Debit card','GCash / e-wallet','Bank transfer'];
const SDK='https://www.gstatic.com/firebasejs/10.12.2/';

const CFG=window.TRIPSPLIT_FIREBASE||{};
const DEMO=!CFG.apiKey||CFG.apiKey==='PASTE_HERE'||!CFG.projectId;
const tripId=(()=>{try{const t=new URLSearchParams(location.search).get('t');return t&&/^[A-Za-z0-9]{20,64}$/.test(t)?t:null}catch(e){return null}})();

let trip=null, expenses=[], ready=false, notFound=false, tab='balances', expFilter='all';
let me=tripId?ls.get('ts_me_'+tripId,null):null;
let sync={pending:false,offline:!navigator.onLine,slow:false,error:false};

/* ---------- money ---------- */
function fmtCur(c,cur){const z=ZERO.includes(cur);
  try{return new Intl.NumberFormat('en-PH',{style:'currency',currency:cur,minimumFractionDigits:z?0:2,maximumFractionDigits:z?0:2}).format(c/100)}catch(e){return cur+' '+(c/100).toFixed(z?0:2)}}
const base=()=>(trip&&trip.currency)||'PHP';
const fmt=c=>fmtCur(c,base());
const rates=()=>(trip&&trip.rates)||{};
const foreignCurs=()=>Object.keys(rates()).filter(c=>c!==base());
const toC=x=>Math.round((parseFloat(String(x).replace(/,/g,''))||0)*100);
const num=x=>parseFloat(String(x).replace(/,/g,''))||0;
function allocate(totalC,weights){
  const ids=Object.keys(weights||{}).filter(k=>weights[k]>0);const W=ids.reduce((a,k)=>a+weights[k],0);if(!W||totalC<=0)return null;
  const raw=ids.map(k=>({k,v:totalC*weights[k]/W}));const out={};let sum=0;
  raw.forEach(r=>{out[r.k]=Math.floor(r.v+1e-9);sum+=out[r.k]});
  let rem=totalC-sum;raw.sort((a,b)=>(b.v-Math.floor(b.v))-(a.v-Math.floor(a.v)));
  for(let i=0;i<rem;i++)out[raw[i%raw.length].k]++;return out;
}
/* origC = amount in the expense's own currency (x100). fxMode: 'trip' estimate at trip rate,
   'custom' locked rate, 'billed' actual base-currency card charge (pending until entered). */
const eCur=e=>e.currency||base();
const eOrig=e=>e.origC!=null?e.origC:(e.amountC||0);
function baseC(e){
  const cur=eCur(e),o=eOrig(e);if(cur===base())return o;
  if(e.fxMode==='custom'&&e.fxRate>0)return Math.round(o*e.fxRate);
  if(e.fxMode==='billed'&&e.billedC>0)return e.billedC;
  const r=rates()[cur];return r>0?Math.round(o*r):0;
}
const isForeign=e=>eCur(e)!==base();
const isPendingCard=e=>isForeign(e)&&e.fxMode==='billed'&&!(e.billedC>0);
const isEst=e=>isForeign(e)&&(e.fxMode==='trip'||isPendingCard(e));
const noRate=e=>isForeign(e)&&baseC(e)===0&&eOrig(e)>0;
const splitsBase=e=>allocate(baseC(e),e.splits)||{};
function fxLabel(e){
  if(!isForeign(e))return '';
  if(noRate(e))return `<span class="neg">no ${esc(eCur(e))} rate set</span>`;
  if(e.fxMode==='billed')return e.billedC>0?`billed ${fmt(e.billedC)}`:`≈${fmt(baseC(e))} · card bill pending`;
  if(e.fxMode==='custom')return `≈${fmt(baseC(e))} @ ${e.fxRate}`;
  return `≈${fmt(baseC(e))} est.`;
}

/* ---------- storage adapters ---------- */
// Demo: this browser only. Firebase: shared, live, offline-capable.
const demo={
  key:id=>'ts_demo_'+id,
  load(id){return ls.get(this.key(id),null)},
  save(id,d){ls.set(this.key(id),d)},
  subscribe(id,onTrip,onExp){const d=this.load(id);this.cbT=onTrip;this.cbE=onExp;this.id=id;onTrip(d?d.trip:null,{fromCache:false});onExp(d?d.expenses:[],{fromCache:false})},
  createTrip(id,t){this.save(id,{trip:t,expenses:[]})},
  saveTrip(id,t){const d=this.load(id)||{expenses:[]};d.trip=t;this.save(id,d);this.cbT&&this.cbT(clone(t),{fromCache:false})},
  putExp(id,e){const d=this.load(id)||{trip:null,expenses:[]};const i=d.expenses.findIndex(x=>x.id===e.id);if(i>=0)d.expenses[i]=e;else d.expenses.push(e);this.save(id,d);this.cbE&&this.cbE(clone(d.expenses),{fromCache:false})},
  delExp(id,eid){const d=this.load(id);if(!d)return;d.expenses=d.expenses.filter(x=>x.id!==eid);this.save(id,d);this.cbE&&this.cbE(clone(d.expenses),{fromCache:false})},
};
let fbx=null;
async function firebase(){
  if(fbx)return fbx;
  const [app,fs]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js')]);
  const a=app.initializeApp(CFG);let db;
  try{db=fs.initializeFirestore(a,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch(e){db=fs.getFirestore(a)}
  const fail=e=>{console.error(e);toast('Not saved: '+(e&&e.code==='permission-denied'?'access denied':'sync error'));};
  fbx={
    subscribe(id,onTrip,onExp,onErr){
      fs.onSnapshot(fs.doc(db,'trips',id),{includeMetadataChanges:true},s=>onTrip(s.exists()?s.data():null,s.metadata),onErr);
      fs.onSnapshot(fs.collection(db,'trips',id,'expenses'),{includeMetadataChanges:true},s=>onExp(s.docs.map(d=>Object.assign({id:d.id},d.data())),s.metadata),onErr);
    },
    createTrip(id,t){return fs.setDoc(fs.doc(db,'trips',id),clone(t))},
    saveTrip(id,t){fs.setDoc(fs.doc(db,'trips',id),clone(t)).catch(fail)},
    putExp(id,e){const b=clone(e);delete b.id;fs.setDoc(fs.doc(db,'trips',id,'expenses',e.id),b).catch(fail)},
    delExp(id,eid){fs.deleteDoc(fs.doc(db,'trips',id,'expenses',eid)).catch(fail)},
  };
  return fbx;
}
let adapter=null;
// Writes are not awaited: offline writes queue locally and sync later; the snapshot updates the screen at once.
const store={
  saveTrip(t){trip=clone(t);adapter.saveTrip(tripId,t);rememberTrip();render();return true},
  putExpense(e){adapter.putExp(tripId,e);return true},
  delExpense(id){adapter.delExp(tripId,id);return true},
};

function setStatus(){
  const el=$('#status');if(!tripId){el.textContent=DEMO?'Demo mode':'';return}
  let t;
  if(DEMO)t='Demo: this phone only';
  else if(sync.error)t='Sync error. Reopen app';
  else if(sync.offline)t=sync.pending?'Offline · will sync':'Offline';
  else if(sync.pending)t='Syncing…';
  else if(sync.slow&&!ready)t='Can’t reach server';
  else t=ready?'Synced':'Connecting…';
  el.textContent=t;
}
addEventListener('online',()=>{sync.offline=false;setStatus()});
addEventListener('offline',()=>{sync.offline=true;setStatus()});

async function openTrip(){
  adapter=DEMO?demo:null;
  if(!DEMO){try{adapter=await firebase()}catch(e){console.error(e);sync.error=true;ready=true;setStatus();$('#view').innerHTML=`<div class="card empty">Could not load the sync engine. Check your internet connection and reopen the app.</div>`;return}}
  let gT=false,gE=false,pT=false,pE=false;
  const timer=setTimeout(()=>{sync.slow=true;if(!ready){ready=true;render()}setStatus()},10000);
  const check=()=>{if(gT&&gE&&!ready){ready=true;clearTimeout(timer)}sync.pending=pT||pE;setStatus()};
  adapter.subscribe(tripId,(t,m)=>{
      trip=t?clone(t):null;pT=!!m.hasPendingWrites;
      if(!m.fromCache){gT=true;notFound=!t}else if(t){gT=true}
      if(t)rememberTrip();check();render();
    },(list,m)=>{expenses=clone(list);pE=!!m.hasPendingWrites;if(!m.fromCache||list.length)gE=true;check();render()},
    e=>{console.error(e);clearTimeout(timer);sync.error=true;ready=true;setStatus();render()});
}
async function createTrip(name,cur){
  const id=rid(22);
  const t={name:name||'Family Trip',currency:cur||'PHP',members:[],rates:{},createdAt:Date.now()};
  try{
    if(DEMO)demo.createTrip(id,t);
    else{const f=await firebase();await Promise.race([f.createTrip(id,t),new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),12000))])}
  }catch(e){toast(e&&e.code==='permission-denied'?'Firebase rules not set yet. See setup guide.':'Could not create trip. Check your connection.');return}
  const rec=ls.get('ts_recent',[]);rec.unshift({id,name:t.name,at:Date.now()});ls.set('ts_recent',rec.slice(0,20));
  location.href='?t='+id;
}
function rememberTrip(){if(!trip)return;const rec=ls.get('ts_recent',[]).filter(r=>r.id!==tripId);rec.unshift({id:tripId,name:trip.name,at:Date.now()});ls.set('ts_recent',rec.slice(0,20))}
const tripLink=()=>{const u=new URL(location.href);u.search='?t='+tripId;u.hash='';return u.toString()};

/* ---------- compute ---------- */
const members=()=>(trip&&trip.members)||[];
const mName=id=>{const m=members().find(x=>x.id===id);return m?m.name:'(removed)'};
const mColor=id=>{const i=members().findIndex(x=>x.id===id);return COLORS[(i<0?0:i)%COLORS.length]};
const initials=n=>esc(String(n||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase());
const av=id=>`<div class="av" style="background:${mColor(id)}">${initials(mName(id))}</div>`;
const fams=()=>(trip&&trip.families)||[];
const hKey=id=>{const m=members().find(x=>x.id===id);return m&&m.fam&&fams().some(f=>f.id===m.fam)?m.fam:id};
const hName=k=>{const f=fams().find(x=>x.id===k);return f?f.name:mName(k)};
const hMembers=k=>members().filter(m=>hKey(m.id)===k);
const hKeys=()=>[...new Set(members().map(m=>hKey(m.id)))];
const hRep=k=>{const ms=hMembers(k);return (me&&ms.some(m=>m.id===me))?me:(ms[0]||{}).id};
const hAv=k=>`<div class="av" style="background:${COLORS[Math.max(0,hKeys().indexOf(k))%COLORS.length]}">${initials(hName(k))}</div>`;
function hNet(net){const o={};hKeys().forEach(k=>o[k]=0);for(const k in net){const h=hKey(k);o[h]=(o[h]||0)+net[k]}return o}
function compute(){
  const net={},paid={},share={};members().forEach(m=>{net[m.id]=0;paid[m.id]=0;share[m.id]=0});
  let total=0,est=0;const byCur={};
  for(const e of expenses){
    const a=baseC(e),sp=splitsBase(e);const exp=e.type!=='payment';
    net[e.paidBy]=(net[e.paidBy]||0)+a;
    if(exp){total+=a;paid[e.paidBy]=(paid[e.paidBy]||0)+a;if(isEst(e))est+=a;
      const c=eCur(e);byCur[c]=byCur[c]||{o:0,b:0};byCur[c].o+=eOrig(e);byCur[c].b+=a}
    for(const k in sp){net[k]=(net[k]||0)-sp[k];if(exp)share[k]=(share[k]||0)+sp[k]}
  }
  return {net,paid,share,total,est,byCur};
}
function simplify(net){
  const cr=[],dr=[];for(const k in net){if(net[k]>0)cr.push([k,net[k]]);else if(net[k]<0)dr.push([k,-net[k]])}
  cr.sort((a,b)=>b[1]-a[1]);dr.sort((a,b)=>b[1]-a[1]);const out=[];let i=0,j=0;
  while(i<cr.length&&j<dr.length){const x=Math.min(cr[i][1],dr[j][1]);if(x>0)out.push({from:dr[j][0],to:cr[i][0],c:x});cr[i][1]-=x;dr[j][1]-=x;if(cr[i][1]===0)i++;if(dr[j][1]===0)j++}
  return out;
}
const inForeign=(c,cur)=>{const r=rates()[cur];return r>0?fmtCur(Math.round(c/r),cur):''};

function isDefaultSplit(){return form.mode==='shares'&&members().every(m=>(form.sh[m.id]||0)===(m.weight||0))}
function drawChips(){
  const ch=(act,v,label,on)=>`<button class="chip ${on?'on':''}" data-act="${act}" data-v="${esc(v)}">${label}</button>`;
  const curs=[base(),...foreignCurs()];
  $('#curChips').innerHTML=curs.length>1?curs.map(c=>ch('cur',c,`${esc(curSym(c))} ${esc(c)}`,form.cur===c)).join(''):'';
  $('#catChips').innerHTML=Object.entries(CATS).map(([k,i])=>ch('cat',k,`${i} ${esc(k)}`,form.cat===k)).join('');
  $('#payChips').innerHTML=members().map(m=>ch('payer',m.id,esc(m.name)+(m.id===me?' (me)':''),form.payer===m.id)).join('');
  const meths=EXP_METHODS.slice();if(!meths.some(x=>x[0]===form.method))meths.push([form.method,'🏦']);
  $('#methChips').innerHTML=meths.map(([k,i])=>ch('meth',k,`${i} ${esc(k)}`,form.method===k)).join('');
}
function drawFx(){
  const box=$('#fxBox');if(!box||!form)return;const cur=form.cur;
  if(cur===base()){box.innerHTML='';updCalc();return}
  const tr=rates()[cur];
  box.innerHTML=`<label>How was it converted to ${esc(base())}?</label>
   <div class="seg" style="margin-top:0"><button data-act="fx" data-f="trip" class="${form.fx==='trip'?'on':''}">Trip rate</button><button data-act="fx" data-f="custom" class="${form.fx==='custom'?'on':''}">My rate</button><button data-act="fx" data-f="billed" class="${form.fx==='billed'?'on':''}">Card bill</button></div>
   ${form.fx==='trip'?`<div class="muted small" style="margin-top:6px">${tr?`1 ${esc(cur)} = ${tr} ${esc(base())} (estimate)`:`<span class="neg">No trip rate for ${esc(cur)} yet. Add it in Setup or use My rate.</span>`}</div>`:''}
   ${form.fx==='custom'?`<div class="row" style="border:0"><span class="small">1 ${esc(cur)} =</span><input id="fRate" inputmode="decimal" value="${esc(form.rateVal||tr||'')}" style="width:130px"><span class="small">${esc(base())}</span></div><div class="muted small">Rate you actually got from a money changer or ATM.</div>`:''}
   ${form.fx==='billed'?`<div class="row" style="border:0"><span class="small">Charged</span><input id="fBilled" inputmode="decimal" value="${esc(form.billedVal)}" placeholder="fill in later" style="flex:1"><span class="small">${esc(base())}</span></div><div class="muted small">Leave blank for now. Fill in the ${esc(base())} amount when it shows on the card app.</div>`:''}
   <div id="fxNote"></div>`;
  updCalc();
}
function drawSplit(){
  const ms=members();const box=$('#splitBox');if(!box)return;const cur=form.cur;
  if(form.mode==='shares'){
    box.innerHTML=`<div style="display:flex;gap:8px;margin:10px 0 4px;flex-wrap:wrap"><button class="btn sm ghost" data-act="all">Everyone</button><button class="btn sm ghost" data-act="none">Nobody</button>${fams().map(f=>`<button class="btn sm ghost" data-act="famtog" data-v="${f.id}">👪 ${esc(f.name)}</button>`).join('')}</div>`+
     ms.map(m=>`<div class="mrow"><input type="checkbox" data-ck="${m.id}" ${form.sh[m.id]>0?'checked':''}><span>${esc(m.name)}</span><input type="number" step="0.5" min="0" data-sh="${m.id}" value="${form.sh[m.id]}"><span class="calc" data-cv="${m.id}"></span></div>`).join('')+
     `<div class="muted small" style="margin-top:6px">Tick who shares this. The number is their share (e.g. 0.5 for a child).</div>`;
  }else{
    box.innerHTML=`<div class="muted small" style="margin:10px 0 4px">Amounts in ${esc(cur)}. Leave blank for people not included.</div>`+
     ms.map(m=>`<div class="mrow"><span></span><span>${esc(m.name)}</span><span></span><input inputmode="decimal" data-ex="${m.id}" value="${form.ex[m.id]}" placeholder="0"></div>`).join('');
  }
  updCalc();
}
function draftExpense(){
  const cur=form.cur,T=toC($('#fAmt').value);
  const d={currency:cur,origC:T,fxMode:cur===base()?null:form.fx};
  if(form.fx==='custom'){const r=$('#fRate');form.rateVal=r?r.value:form.rateVal;d.fxRate=num(form.rateVal)}
  if(form.fx==='billed'){const b=$('#fBilled');form.billedVal=b?b.value:form.billedVal;d.billedC=toC(form.billedVal)}
  return d;
}
function updCalc(){
  const amtEl=$('#fAmt');if(!amtEl||!form)return;const d=draftExpense();const T=d.origC,cur=d.currency;const note=$('#splitNote');
  const fxn=$('#fxNote');if(fxn){const b=baseC(d);fxn.innerHTML=T>0?(b>0?`<div class="note ok">= ${fmt(b)}${isEst(d)?' (estimate)':''}</div>`:`<div class="note bad">No rate yet, so this counts as zero.</div>`):''}
  const sum=$('#splitSum');
  if(form.mode==='shares'){const al=allocate(T,form.sh)||{};
    members().forEach(m=>{const el=document.querySelector(`[data-cv="${m.id}"]`);if(el)el.textContent=form.sh[m.id]>0&&T>0?fmtCur(al[m.id]||0,cur):'–'});
    const ids=Object.keys(form.sh).filter(k=>form.sh[k]>0);
    if(sum){const who=isDefaultSplit()?'Everyone':ids.map(mName).join(', ')||'Nobody yet';
      const each=T>0&&ids.length?ids.map(k=>`<div class="srow"><span>${esc(mName(k))}</span><b>${fmtCur(al[k]||0,cur)}</b></div>`).join(''):'';
      sum.innerHTML=`<div class="srow"><b>${esc(who)}</b>${form.showSplit?'':'<button class="linkbtn" data-act="showSplit">Change</button>'}</div>${each}`}
    note.innerHTML=ids.length?'':'<div class="note bad">Pick at least one person.</div>';
  }else{let s=0;members().forEach(m=>s+=toC(form.ex[m.id]));const df=T-s;
    if(sum)sum.innerHTML=`<div class="srow"><b>Exact amounts per person</b></div>`;
    note.innerHTML=df===0&&T>0?`<div class="note ok">Adds up to ${fmtCur(T,cur)}.</div>`:`<div class="note bad">${df>0?fmtCur(df,cur)+' left to assign':fmtCur(-df,cur)+' over the total'}</div>`}
}
function saveExp(){
  const d=draftExpense(),T=d.origC,cur=d.currency;const desc=$('#fDesc').value.trim()||form.cat;
  if(T<=0){toast('Type the amount first');$('#fAmt').focus();return}
  if(cur!==base()){
    if(d.fxMode==='trip'&&!(rates()[cur]>0))return toast(`Set a ${cur} rate in Setup first, or use My rate`);
    if(d.fxMode==='custom'&&!(d.fxRate>0))return toast('Enter the rate you got');
    if(d.fxMode==='billed'&&!(d.billedC>0)&&!(rates()[cur]>0))return toast(`Add a ${cur} trip rate in Setup first`);
  }
  let splits;
  if(form.mode==='shares'){splits=allocate(T,form.sh);if(!splits)return toast('Pick who shares this')}
  else{splits={};let s=0;members().forEach(m=>{const c=toC(form.ex[m.id]);if(c>0){splits[m.id]=c;s+=c}});if(s!==T)return toast('Amounts per person must add up to the total')}
  const old=form.id?expenses.find(x=>x.id===form.id):null;
  const e={id:form.id||newId(),type:'expense',desc,currency:cur,origC:T,fxMode:d.fxMode,fxRate:d.fxMode==='custom'?d.fxRate:null,billedC:d.fxMode==='billed'&&d.billedC>0?d.billedC:null,
    method:form.method,date:$('#fDate').value||today(),paidBy:form.payer,category:form.cat,splitMode:form.mode,splits,
    shares:form.mode==='shares'?Object.fromEntries(Object.entries(form.sh).filter(([k,v])=>v>0)):null,
    createdAt:old?old.createdAt:Date.now(),addedBy:old?(old.addedBy||null):(me||null),updatedBy:me||null};
  ls.set('ts_lastcur_'+tripId,cur);
  store.putExpense(e);closeModal();toast(old?'✓ Saved':`✓ Saved ${fmtCur(T,cur)} for ${desc}`);
}

function openSettle(from,to,c,existing){
  const ms=members();const e=existing||null;const eTo=e?Object.keys(e.splits||{})[0]:to;const cur=e?eCur(e):base();
  form={id:e?e.id:null,settle:true};
  openModal(`<div class="top"><h3>${e?'Edit payment':'Record a payment'}</h3><button class="x" data-act="close">×</button></div>
   <div class="muted small" style="margin-top:6px">Use this when someone pays back, in ${esc(base())} or in local cash.</div>
   <div class="two"><div><label>From</label><select id="pFrom">${ms.map(m=>`<option value="${m.id}" ${(e?e.paidBy:(from||me))===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div>
   <div><label>To</label><select id="pTo">${ms.map(m=>`<option value="${m.id}" ${eTo===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></div></div>
   <div class="two"><div><label>Amount</label><input id="pAmt" inputmode="decimal" value="${e?(eOrig(e)/100).toFixed(2):c?(c/100).toFixed(2):''}"></div><div><label>Currency</label><select id="pCur">${curOptions(cur)}</select></div></div>
   <div id="pRateBox"></div>
   <div class="two"><div><label>Paid via</label><select id="pMethod">${METHODS.map(x=>`<option ${(e?e.method:'GCash / e-wallet')===x?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Date</label><input type="date" id="pDate" value="${esc(e?e.date:today())}"></div></div>
   <div class="actions">${e?'<button class="btn danger" data-act="delExp">Delete</button>':''}<button class="btn" data-act="savePay">Save payment</button></div>`);
  form.payRate=e&&e.fxRate?e.fxRate:'';drawPayRate();
}
function drawPayRate(){
  const box=$('#pRateBox');if(!box)return;const cur=$('#pCur').value;
  if(cur===base()){box.innerHTML='';return}
  box.innerHTML=`<div class="row" style="border:0"><span class="small">1 ${esc(cur)} =</span><input id="pRate" inputmode="decimal" value="${esc(form.payRate||rates()[cur]||'')}" style="width:120px"><span class="small">${esc(base())}</span></div><div class="muted small">Rate agreed for this payback. Locked.</div>`;
}
function savePay(){
  const f=$('#pFrom').value,t=$('#pTo').value,cur=$('#pCur').value,c=toC($('#pAmt').value);
  if(f===t)return toast('Pick two different people');if(c<=0)return toast('Enter an amount');
  let rate=null;if(cur!==base()){rate=num(($('#pRate')||{}).value);if(!(rate>0))return toast('Enter the rate')}
  const old=form.id?expenses.find(x=>x.id===form.id):null;
  const e={id:form.id||newId(),type:'payment',desc:'Payment',currency:cur,origC:c,fxMode:rate?'custom':null,fxRate:rate,method:$('#pMethod').value,
    date:$('#pDate').value||today(),paidBy:f,splits:{[t]:c},createdAt:old?old.createdAt:Date.now(),addedBy:old?(old.addedBy||null):(me||null),updatedBy:me||null};
  store.putExpense(e);closeModal();toast('Payment recorded');
}

function summaryText(){
  const {net,paid,share,total,est,byCur}=compute();const tx=simplify(hNet(net));
  let d='';try{d=new Date().toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'})}catch(e){}
  let s=`${trip.name} expense summary (as of ${d})\nTotal spent: ${fmt(total)}\n`;
  const parts=Object.entries(byCur).filter(([c])=>c!==base());
  if(parts.length)s+=parts.map(([c,v])=>`• ${fmtCur(v.o,c)} = ${fmt(v.b)}`).join('\n')+'\n';
  const rs=foreignCurs().map(c=>`1 ${c} = ${rates()[c]} ${base()}`).join(', ');
  if(est>0)s+=`Note: ${fmt(est)} uses estimated rates (${rs}). Final once card bills post.\n`;
  s+='\n'+(tx.length?'To settle up:\n'+tx.map(t=>`• ${hName(t.from)} pays ${hName(t.to)} ${fmt(t.c)}`).join('\n'):'Everyone is settled up.');
  s+='\n\nPaid / share:\n'+hKeys().map(k=>{const mm=hMembers(k);const sp=mm.reduce((a,m)=>a+(paid[m.id]||0),0),ss=mm.reduce((a,m)=>a+(share[m.id]||0),0);return `• ${hName(k)}: ${fmt(sp)} / ${fmt(ss)}`+(fams().some(f=>f.id===k)?` (${mm.map(m=>m.name).join(', ')})`:'')}).join('\n');
  s+='\n\nDetails: '+tripLink();
  return s;
}
function openSummary(){
  openModal(`<div class="top"><h3>Summary for group chat</h3><button class="x" data-act="close">×</button></div>
   <label>Text</label><textarea id="sumTxt" readonly>${esc(summaryText())}</textarea>
   <div class="actions"><button class="btn ghost" data-act="copySum">Copy</button>${navigator.share?'<button class="btn" data-act="shareSum">Share</button>':''}</div>`);
}
function openPickMe(){
  openModal(`<div class="top"><h3>Who are you?</h3><button class="x" data-act="close">×</button></div>
   <div class="muted small" style="margin-top:6px">Saved on this phone only.</div>
   ${members().map(m=>`<div class="row exp" data-act="setme" data-id="${m.id}">${av(m.id)}<div class="l"><b>${esc(m.name)}</b></div></div>`).join('')}`);
}
async function copyText(t,msg){try{await navigator.clipboard.writeText(t);toast(msg)}catch(e){toast('Copy failed. Press and hold to copy.')}}

/* ---------- events ---------- */
let wipeArmed=false;
document.addEventListener('click',async ev=>{
  const tb=ev.target.closest('#tabs button');if(tb){tab=tb.dataset.tab;render();try{window.scrollTo(0,0)}catch(e){}return}
  if(ev.target.id==='modal'){closeModal();return}
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(b.tagName==='A')ev.preventDefault();
  if(a==='home')location.href=location.pathname;
  else if(a==='create'){b.disabled=true;b.textContent='Creating…';await createTrip($('#hName').value.trim(),$('#hCur').value);b.disabled=false;b.textContent='Create trip'}
  else if(a==='join'){const v=$('#hJoin').value.trim();const m=v.match(/[?&]t=([A-Za-z0-9]{20,64})/)||v.match(/^([A-Za-z0-9]{20,64})$/);if(!m)return toast('That does not look like a trip link');location.href='?t='+m[1]}
  else if(a==='share'){const u=tripLink();if(navigator.share){try{await navigator.share({title:trip.name,text:`Join our TripSplit for ${trip.name}`,url:u})}catch(e){}}else copyText(u,'Link copied')}
  else if(a==='copyLink')copyText(tripLink(),'Link copied');
  else if(a==='pickme')openPickMe();
  else if(a==='setme'){me=b.dataset.id;ls.set('ts_me_'+tripId,me);closeModal();render();toast('Hi '+mName(me)+'!')}
  else if(a==='add')openExpense(null);
  else if(a==='edit')openExpense(b.dataset.id);
  else if(a==='close')closeModal();
  else if(a==='filt'){expFilter=b.dataset.f;render()}
  else if(a==='mode'){form.mode=b.dataset.m;b.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));drawSplit()}
  else if(a==='fx'){draftExpense();form.fx=b.dataset.f;drawFx()}
  else if(a==='all'){members().forEach(m=>{if(!(form.sh[m.id]>0))form.sh[m.id]=m.weight||1});drawSplit()}
  else if(a==='none'){members().forEach(m=>form.sh[m.id]=0);drawSplit()}
  else if(a==='cur'){draftExpense();form.cur=b.dataset.v;if(form.method==='Credit card'&&form.cur!==base()&&form.fx==='trip')form.fx='billed';drawChips();drawFx();drawSplit()}
  else if(a==='cat'){form.cat=b.dataset.v;drawChips()}
  else if(a==='payer'){form.payer=b.dataset.v;drawChips()}
  else if(a==='meth'){draftExpense();form.method=b.dataset.v;if(form.cur!==base()){if(form.method==='Credit card'&&form.fx==='trip')form.fx='billed';else if(form.method!=='Credit card'&&form.fx==='billed'&&!form.billedVal)form.fx='trip'}drawChips();drawFx()}
  else if(a==='showSplit'){form.showSplit=true;$('#splitWrap').style.display='';updCalc()}
  else if(a==='saveExp')saveExp();
  else if(a==='savePay')savePay();
  else if(a==='delExp'){if(b.dataset.armed){store.delExpense(form.id);closeModal();toast('Deleted')}else{b.dataset.armed='1';b.textContent='Tap again to delete'}}
  else if(a==='settle')openSettle(b.dataset.from||null,b.dataset.to||null,+b.dataset.c||null,null);
  else if(a==='summary')openSummary();
  else if(a==='copySum')copyText($('#sumTxt').value,'Copied. Paste in your group chat');
  else if(a==='shareSum'){try{await navigator.share({text:$('#sumTxt').value})}catch(e){}}
  else if(a==='saveTrip'){const t=clone(trip);t.name=$('#sName').value.trim()||'Family Trip';t.currency=$('#sCur').value;t.rates=t.rates||{};delete t.rates[t.currency];store.saveTrip(t);toast('Trip saved')}
  else if(a==='addRate'){const c=$('#newCur').value,r=num($('#newRate').value);if(!c)return;if(!(r>0))return toast('Enter the rate, e.g. 1 JPY = 0.385 PHP');
    const t=clone(trip);t.rates=t.rates||{};t.rates[c]=r;store.saveTrip(t);toast(c+' rate added')}
  else if(a==='rmRate'){const t=clone(trip);delete t.rates[b.dataset.c];store.saveTrip(t)}
  else if(a==='saveRates'){const t=clone(trip);let bad=false;Object.keys(t.rates||{}).forEach(c=>{const el=document.querySelector(`[data-rate="${c}"]`);const r=el?num(el.value):0;if(r>0)t.rates[c]=r;else bad=true});if(bad)return toast('Rates must be above zero');store.saveTrip(t);toast('Rates updated. Balances re-valued')}
  else if(a==='addFam'){const n=$('#newF').value.trim();if(!n)return toast('Type a family name');const t=clone(trip);t.families=t.families||[];if(t.families.some(f=>f.name.toLowerCase()===n.toLowerCase()))return toast('That family already exists');t.families.push({id:'f'+newId(),name:n});store.saveTrip(t);toast(n+' added. Now pick it for each person below.')}
  else if(a==='rmFam'){const t=clone(trip);t.families=(t.families||[]).filter(f=>f.id!==b.dataset.id);store.saveTrip(t)}
  else if(a==='saveFams'){const t=clone(trip);(t.families||[]).forEach(f=>{const el=document.querySelector(`[data-fname="${f.id}"]`);if(el&&el.value.trim())f.name=el.value.trim()});store.saveTrip(t);toast('Family names saved')}
  else if(a==='famtog'){const ids=members().filter(m=>m.fam===b.dataset.v).map(m=>m.id);const allOn=ids.every(i=>form.sh[i]>0);ids.forEach(i=>{const m=members().find(x=>x.id===i);form.sh[i]=allOn?0:(m.weight||1)});drawSplit()}
  else if(a==='addMember'){const n=$('#newM').value.trim();if(!n)return toast('Type a name');const w=Math.max(0,parseFloat($('#newW').value)||1);
    const t=clone(trip);if(t.members.some(m=>m.name.toLowerCase()===n.toLowerCase()))return toast('That name is already on the list');
    const nf=$('#newMF');t.members.push({id:'m'+newId(),name:n,weight:w,fam:nf&&nf.value?nf.value:null});store.saveTrip(t);toast(n+' added');const el=$('#newM');if(el)el.focus()}
  else if(a==='rmMember'){const t=clone(trip);t.members=t.members.filter(m=>m.id!==b.dataset.id);store.saveTrip(t);if(me===b.dataset.id){me=null;ls.set('ts_me_'+tripId,null)}}
  else if(a==='saveMembers'){const t=clone(trip);t.members.forEach(m=>{const ni=document.querySelector(`[data-mname="${m.id}"]`),wi=document.querySelector(`[data-mw="${m.id}"]`);if(ni&&ni.value.trim())m.name=ni.value.trim();const fi=document.querySelector(`[data-mfam="${m.id}"]`);if(fi)m.fam=fi.value||null;if(wi)m.weight=Math.max(0,parseFloat(wi.value)||0)});store.saveTrip(t);toast('Members saved')}
  else if(a==='wipe'){if(!wipeArmed){wipeArmed=true;b.textContent='Tap again to delete everything';setTimeout(()=>{wipeArmed=false;const x=$('#wipeBtn');if(x)x.textContent='Clear all expenses'},4000);return}
    wipeArmed=false;expenses.map(e=>e.id).forEach(id=>store.delExpense(id));toast('All expenses cleared')}
});
document.addEventListener('input',ev=>{
  const t=ev.target;if(!form)return;
  if(t.id==='fAmt'||t.id==='fRate'||t.id==='fBilled')updCalc();
  else if(t.dataset.sh){form.sh[t.dataset.sh]=Math.max(0,parseFloat(t.value)||0);const ck=document.querySelector(`[data-ck="${t.dataset.sh}"]`);if(ck)ck.checked=form.sh[t.dataset.sh]>0;updCalc()}
  else if(t.dataset.ex!==undefined){form.ex[t.dataset.ex]=t.value;updCalc()}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='meSel'){me=t.value||null;ls.set('ts_me_'+tripId,me);toast(me?'Hi '+mName(me)+'!':'Cleared');return}
  if(!form)return;
  if(t.id==='fCur'){drawFx();drawSplit();return}
  if(t.id==='fMethod'){if(t.value==='Credit card'&&$('#fCur').value!==base()&&form.fx==='trip'){draftExpense();form.fx='billed';drawFx()}return}
  if(t.id==='pCur'){drawPayRate();return}
  if(!t.dataset.ck)return;const id=t.dataset.ck;const m=members().find(x=>x.id===id);
  form.sh[id]=t.checked?(m&&m.weight>0?m.weight:1):0;const sh=document.querySelector(`[data-sh="${id}"]`);if(sh)sh.value=form.sh[id];updCalc();
});
document.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.id==='newM'){ev.preventDefault();const b=document.querySelector('[data-act="addMember"]');if(b)b.click()}if(ev.key==='Escape')closeModal()});

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3500)}

if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
if(tripId)openTrip();
})();
</script>
</body>
</html>
